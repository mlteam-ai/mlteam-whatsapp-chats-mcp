[project]
name = "mlteam-whatsapp-chats-mcp"
version = "0.1.0"
description = "Read-only MCP server that lets Claude answer questions from the WhatsApp chats you choose"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "neonize>=0.10.0",
    "openpyxl>=3.1.5",
    "pypdf>=7.1.1",
]

[project.scripts]
whatsapp-chats = "whatsapp_chats.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whatsapp_chats"]
